<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#ffffff" />

  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">S2PNexus — Fortified Enterprise Fleet Architecture</text>
  <text x="600" y="56" text-anchor="middle" font-size="13" fill="#64748b">All Things Agentic Hackathon — requisition intake → sourcing check → receipt match, on Google ADK + Gemini 3.5 Flash</text>

  <!-- Frontend -->
  <rect x="40" y="100" width="220" height="90" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="150" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4ed8">Frontend</text>
  <text x="150" y="150" text-anchor="middle" font-size="11" fill="#334155">Next.js — Cloud Run</text>
  <text x="150" y="167" text-anchor="middle" font-size="11" fill="#334155">/dashboard/agent</text>

  <!-- Backend -->
  <rect x="340" y="100" width="280" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="480" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#15803d">S2PNexus Backend</text>
  <text x="480" y="146" text-anchor="middle" font-size="11" fill="#334155">FastAPI 0.111 — Cloud Run</text>
  <text x="480" y="166" text-anchor="middle" font-size="11" fill="#334155">POST /agents/pipelines/p2p-intake</text>
  <text x="480" y="184" text-anchor="middle" font-size="11" fill="#334155">Gathers grounding data via app.agents.tools</text>
  <text x="480" y="202" text-anchor="middle" font-size="11" fill="#334155">Owns DB access + Agent Identity/RBAC</text>
  <text x="480" y="220" text-anchor="middle" font-size="11" fill="#334155">Logs every step to Agent Activity Log</text>
  <text x="480" y="238" text-anchor="middle" font-size="10" font-style="italic" fill="#64748b">(also runs 12 non-ADK domain agents, unchanged)</text>

  <!-- Postgres -->
  <rect x="680" y="100" width="200" height="90" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="780" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#854d0e">Postgres</text>
  <text x="780" y="150" text-anchor="middle" font-size="11" fill="#334155">Self-hosted VM, tenant-isolated</text>
  <text x="780" y="167" text-anchor="middle" font-size="11" fill="#334155">Requisitions, suppliers, receipts...</text>

  <!-- Agent Activity Dashboard -->
  <rect x="930" y="100" width="230" height="90" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="1045" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#6d28d9">Agent Activity Dashboard</text>
  <text x="1045" y="148" text-anchor="middle" font-size="11" fill="#334155">Observability — every step, tool,</text>
  <text x="1045" y="165" text-anchor="middle" font-size="11" fill="#334155">latency, success/failure, judge-facing</text>

  <!-- Trust boundary -->
  <rect x="330" y="290" width="850" height="330" rx="14" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="345" y="312" font-size="11" fill="#64748b">Trust boundary — Agent Gateway: separate service, separate credentials, no DB access</text>

  <!-- ADK service -->
  <rect x="370" y="330" width="360" height="250" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="550" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#c2410c">adk-service (Cloud Run)</text>
  <text x="550" y="376" text-anchor="middle" font-size="11" fill="#334155">FastAPI 0.115+ · google-adk 2.6.3</text>
  <text x="550" y="394" text-anchor="middle" font-size="11" fill="#334155">isolated requirements.txt, own container</text>

  <rect x="395" y="410" width="310" height="150" rx="8" fill="#ffffff" stroke="#fb923c" stroke-width="1.2"/>
  <text x="550" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#9a3412">google.adk.workflow.Workflow</text>

  <rect x="410" y="442" width="86" height="40" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="453" y="460" text-anchor="middle" font-size="9" fill="#7c2d12">Requisition</text>
  <text x="453" y="472" text-anchor="middle" font-size="9" fill="#7c2d12">intake</text>

  <rect x="507" y="442" width="86" height="40" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="550" y="460" text-anchor="middle" font-size="9" fill="#7c2d12">Sourcing</text>
  <text x="550" y="472" text-anchor="middle" font-size="9" fill="#7c2d12">check</text>

  <rect x="604" y="442" width="86" height="40" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="647" y="460" text-anchor="middle" font-size="9" fill="#7c2d12">Receipt</text>
  <text x="647" y="472" text-anchor="middle" font-size="9" fill="#7c2d12">match</text>

  <line x1="496" y1="462" x2="507" y2="462" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="593" y1="462" x2="604" y2="462" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="550" y="498" text-anchor="middle" font-size="9" fill="#78716c">output_key writes to session state; next step's</text>
  <text x="550" y="510" text-anchor="middle" font-size="9" fill="#78716c">instruction reads it back via {key} templating</text>
  <text x="550" y="526" text-anchor="middle" font-size="9" fill="#78716c">Each step: LlmAgent + FunctionTool(s) over</text>
  <text x="550" y="538" text-anchor="middle" font-size="9" fill="#78716c">grounding data provided by the backend</text>
  <text x="550" y="554" text-anchor="middle" font-size="9" fill="#78716c">(no direct DB access from this service)</text>

  <!-- Vertex AI -->
  <rect x="790" y="330" width="360" height="120" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="970" y="358" text-anchor="middle" font-size="14" font-weight="bold" fill="#3730a3">Vertex AI</text>
  <text x="970" y="378" text-anchor="middle" font-size="11" fill="#334155">Gemini 3.5 Flash</text>
  <text x="970" y="396" text-anchor="middle" font-size="11" fill="#334155">Google Cloud project: s2pnexus</text>
  <text x="970" y="414" text-anchor="middle" font-size="11" fill="#334155">ADC / service account auth</text>
  <text x="970" y="432" text-anchor="middle" font-size="10" font-style="italic" fill="#64748b">Same model used by the 12 non-ADK agents</text>

  <!-- Fortified Enterprise Fleet framing -->
  <rect x="790" y="470" width="360" height="130" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="970" y="494" text-anchor="middle" font-size="12" font-weight="bold" fill="#9d174d">Fortified Enterprise Fleet framing</text>
  <text x="970" y="514" text-anchor="middle" font-size="10" fill="#334155">Registry: app/agents/agent_registry.py (12 agents)</text>
  <text x="970" y="530" text-anchor="middle" font-size="10" fill="#334155">Runtime: this Workflow, async per-request</text>
  <text x="970" y="546" text-anchor="middle" font-size="10" fill="#334155">Identity: tenant RBAC stays in the backend only</text>
  <text x="970" y="562" text-anchor="middle" font-size="10" fill="#334155">Gateway: token-checked service boundary above</text>
  <text x="970" y="578" text-anchor="middle" font-size="10" fill="#334155">Observability: Agent Activity Log, per step</text>

  <!-- Arrows -->
  <line x1="260" y1="145" x2="340" y2="145" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="150" x2="680" y2="145" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="200" x2="930" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="480" y1="250" x2="480" y2="330" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="490" y="272" font-size="10" fill="#475569">HTTPS + Bearer token</text>
  <text x="490" y="286" font-size="10" fill="#475569">{request_text, requisitions,</text>
  <text x="490" y="300" font-size="10" fill="#475569">suppliers, sourcing_events, receipts}</text>

  <line x1="730" y1="455" x2="790" y2="390" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="736" y="415" font-size="10" fill="#475569">generateContent</text>

  <!-- Legend -->
  <text x="40" y="700" font-size="11" fill="#64748b">Solid boxes = deployed/deployable services. Dashed box = the new trust boundary this hackathon build introduces.</text>
  <text x="40" y="718" font-size="11" fill="#64748b">See adk-service/README.md for the fastapi/starlette/uvicorn version-pin reason this is a separate service, not an in-process import.</text>
  <text x="40" y="736" font-size="11" fill="#64748b">Status as of 2026-08-11: deployed to Cloud Run and live-smoke-tested end-to-end against Vertex AI (real 3-step handoff, confirmed via Agent Activity Log).</text>
</svg>
